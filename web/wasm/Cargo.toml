[workspace]

[package]
name = "cobol-transformer-wasm"
version = "0.1.0"
edition = "2021"
description = "wasm-bindgen wrapper exposing the cobol-transformer library to the browser"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cobol-transformer = { path = "../../cobol-transformer" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
