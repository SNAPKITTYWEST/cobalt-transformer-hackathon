[workspace]

[package]
name = "cobol-transformer"
version = "0.1.0"
edition = "2021"
authors = ["COBOL Transformer Team"]
description = "Production-grade COBOL source-to-source transformer"
license = "MIT"

[[bin]]
name = "cobol-transform"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
regex = "1.10"
lazy_static = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = "2.2"
petgraph = "0.6"
logos = "0.14"
codespan-reporting = "0.11"
unicode-width = "0.1"

# IBM Cloud Integration
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.35", features = ["full"] }

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
pretty_assertions = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 1