<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      :root {
        --text: #1a1a1a;
        --bg: #fff;
        --border: #ddd;
        --green: #28a745;
        --yellow: #ffc107;
        --red: #dc3545;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #f0f0f0;
          --bg: #1a1a1a;
          --border: #444;
          --green: #51cf66;
          --yellow: #ffd43b;
          --red: #ff6b6b;
        }
      }
      .header { fill: var(--border); }
      .cell-text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; font-size: 13px; }
      .row-label { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 500; }
      .status-ok { fill: var(--green); }
      .status-partial { fill: var(--yellow); }
    </style>
  </defs>

  <rect x="10" y="10" width="180" height="40" class="header" />
  <rect x="190" y="10" width="140" height="40" class="header" />
  <rect x="330" y="10" width="100" height="40" class="header" />
  <rect x="430" y="10" width="100" height="40" class="header" />
  <rect x="530" y="10" width="120" height="40" class="header" />
  <rect x="650" y="10" width="240" height="40" class="header" />

  <text x="100" y="40" class="row-label" text-anchor="middle">Component</text>
  <text x="260" y="40" class="row-label" text-anchor="middle">Status</text>
  <text x="380" y="40" class="row-label" text-anchor="middle">Tests</text>
  <text x="480" y="40" class="row-label" text-anchor="middle">Lines</text>
  <text x="590" y="40" class="row-label" text-anchor="middle">Critical Path</text>
  <text x="770" y="40" class="row-label" text-anchor="middle">Description</text>

  <rect x="10" y="50" width="180" height="50" fill="var(--bg)" stroke="var(--border)" />
  <rect x="190" y="50" width="140" height="50" fill="var(--bg)" stroke="var(--border)" />
  <rect x="330" y="50" width="100" height="50" fill="var(--bg)" stroke="var(--border)" />
  <rect x="430" y="50" width="100" height="50" fill="var(--bg)" stroke="var(--border)" />
  <rect x="530" y="50" width="120" height="50" fill="var(--bg)" stroke="var(--border)" />
  <rect x="650" y="50" width="240" height="50" fill="var(--bg)" stroke="var(--border)" />

  <text x="100" y="75" class="row-label" text-anchor="middle">Rust Parser</text>
  <circle cx="260" cy="75" r="10" class="status-ok" />
  <text x="380" y="75" class="cell-text" text-anchor="middle">4/4 pass</text>
  <text x="480" y="75" class="cell-text" text-anchor="middle">12.4K</text>
  <text x="590" y="75" class="cell-text" text-anchor="middle">Demo + Rust API</text>
  <text x="770" y="75" class="cell-text" text-anchor="middle">Lexer→AST→CFG</text>

  <rect x="10" y="100" width="180" height="50" fill="var(--bg)" stroke="var(--border)" />
  <rect x="190" y="100" width="140" height="50" fill="var(--bg)" stroke="var(--border)" />
  <rect x="330" y="100" width="100" height="50" fill="var(--bg)" stroke="var(--border)" />
  <rect x="430" y="100" width="100" height="50" fill="var(--bg)" stroke="var(--border)" />
  <rect x="530" y="100" width="120" height="50" fill="var(--bg)" stroke="var(--border)" />
  <rect x="650" y="100" width="240" height="50" fill="var(--bg)" stroke="var(--border)" />

  <text x="100" y="125" class="row-label" text-anchor="middle">Web Playground</text>
  <circle cx="260" cy="125" r="10" class="status-ok" />
  <text x="380" y="125" class="cell-text" text-anchor="middle">E2E ✓</text>
  <text x="480" y="125" class="cell-text" text-anchor="middle">1.3K+WASM</text>
  <text x="590" y="125" class="cell-text" text-anchor="middle">GitHub Pages</text>
  <text x="770" y="125" class="cell-text" text-anchor="middle">8 samples live</text>

  <rect x="10" y="150" width="180" height="50" fill="var(--bg)" stroke="var(--border)" />
  <rect x="190" y="150" width="140" height="50" fill="var(--bg)" stroke="var(--border)" />
  <rect x="330" y="150" width="100" height="50" fill="var(--bg)" stroke="var(--border)" />
  <rect x="430" y="150" width="100" height="50" fill="var(--bg)" stroke="var(--border)" />
  <rect x="530" y="150" width="120" height="50" fill="var(--bg)" stroke="var(--border)" />
  <rect x="650" y="150" width="240" height="50" fill="var(--bg)" stroke="var(--border)" />

  <text x="100" y="175" class="row-label" text-anchor="middle">GPU-COBOL</text>
  <circle cx="260" cy="175" r="10" class="status-partial" />
  <text x="380" y="175" class="cell-text" text-anchor="middle">IR ✓ PTX ✗</text>
  <text x="480" y="175" class="cell-text" text-anchor="middle">4.8K</text>
  <text x="590" y="175" class="cell-text" text-anchor="middle">6-8h to fix</text>
  <text x="770" y="175" class="cell-text" text-anchor="middle">COBOL→PTX</text>

  <rect x="10" y="200" width="180" height="50" fill="var(--bg)" stroke="var(--border)" />
  <rect x="190" y="200" width="140" height="50" fill="var(--bg)" stroke="var(--border)" />
  <rect x="330" y="200" width="100" height="50" fill="var(--bg)" stroke="var(--border)" />
  <rect x="430" y="200" width="100" height="50" fill="var(--bg)" stroke="var(--border)" />
  <rect x="530" y="200" width="120" height="50" fill="var(--bg)" stroke="var(--border)" />
  <rect x="650" y="200" width="240" height="50" fill="var(--bg)" stroke="var(--border)" />

  <text x="100" y="225" class="row-label" text-anchor="middle">Haskell Compiler</text>
  <circle cx="260" cy="225" r="10" class="status-ok" />
  <text x="380" y="225" class="cell-text" text-anchor="middle">26 modules</text>
  <text x="480" y="225" class="cell-text" text-anchor="middle">8.2K</text>
  <text x="590" y="225" class="cell-text" text-anchor="middle">Analysis/proofs</text>
  <text x="770" y="225" class="cell-text" text-anchor="middle">Hand-rolled</text>

  <circle cx="20" cy="280" r="8" class="status-ok" />
  <text x="40" y="285" class="cell-text">Complete / Ready</text>

  <circle cx="220" cy="280" r="8" class="status-partial" />
  <text x="240" y="285" class="cell-text">Partial / Known Issues</text>
</svg>
